<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Pokemon Red - Map Viewer</title>
    
    <!-- Bootstrap 5.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0d1117;
            color: #c9d1d9;
            overflow: hidden;
        }

        #container {
            display: flex;
            height: 100vh;
            position: relative;
        }

        #sidebar {
            width: 320px;
            min-width: 320px;
            background: #161b22;
            border-right: 1px solid #30363d;
            overflow-y: auto;
            padding: 1rem;
            transition: transform 0.3s ease, margin-left 0.3s ease;
            z-index: 100;
            position: relative;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
            margin-left: -320px;
        }

        #sidebar::-webkit-scrollbar {
            width: 8px;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #0d1117;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #484f58;
        }

        #toggleSidebarBtn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 200;
            transition: left 0.3s ease;
        }

        #toggleSidebarBtn.sidebar-visible {
            left: 340px;
        }

        #mapCanvas {
            flex: 1;
            background: #000;
            cursor: grab;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #mapCanvas:active {
            cursor: grabbing;
        }

        .map-list {
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #30363d;
            border-radius: 6px;
            background: #0d1117;
        }

        .map-list::-webkit-scrollbar {
            width: 6px;
        }

        .map-list::-webkit-scrollbar-track {
            background: #0d1117;
        }

        .map-list::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 3px;
        }

        .map-item {
            padding: 0.5rem 0.75rem;
            margin: 0.25rem;
            background: #161b22;
            border: 1px solid #30363d;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 4px;
            font-size: 0.85rem;
        }

        .map-item:hover {
            background: #21262d;
            border-color: #58a6ff;
        }

        .map-item.active {
            background: #1f6feb;
            border-color: #1f6feb;
            color: #fff;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
        }

        .card-header {
            background: #21262d;
            border-bottom: 1px solid #30363d;
            font-weight: bold;
            color: #58a6ff;
        }

        .badge {
            font-family: 'Courier New', monospace;
        }

        .btn-primary {
            background: #238636;
            border-color: #238636;
        }

        .btn-primary:hover {
            background: #2ea043;
            border-color: #2ea043;
        }

        .btn-secondary {
            background: #21262d;
            border-color: #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
            border-color: #484f58;
        }

        .form-control, .form-select {
            background: #0d1117;
            border-color: #30363d;
            color: #c9d1d9;
        }

        .form-control:focus, .form-select:focus {
            background: #0d1117;
            border-color: #58a6ff;
            color: #c9d1d9;
            box-shadow: 0 0 0 0.25rem rgba(88, 166, 255, 0.25);
        }

        .form-check-input {
            background-color: #0d1117;
            border-color: #30363d;
        }

        .form-check-input:checked {
            background-color: #238636;
            border-color: #238636;
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        .spinner-border {
            width: 3rem;
            height: 3rem;
        }

        /* Modal custom styling */
        .modal-content {
            background: #161b22;
            border: 1px solid #30363d;
        }

        .modal-header {
            border-bottom: 1px solid #30363d;
        }

        .modal-footer {
            border-top: 1px solid #30363d;
        }

        .npc-info-item {
            padding: 0.5rem;
            margin: 0.25rem 0;
            background: #0d1117;
            border-radius: 4px;
            border-left: 3px solid #58a6ff;
        }

        .npc-info-label {
            color: #8b949e;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-block;
            min-width: 100px;
        }

        .npc-info-value {
            color: #c9d1d9;
            font-size: 0.9rem;
        }

        .btn-group-sm > .btn {
            font-size: 0.8rem;
        }

        #tileTooltip {
            position: fixed;
            display: none;
            background: rgba(13, 17, 23, 0.98);
            color: #c9d1d9;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #30363d;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            z-index: 10000;
            pointer-events: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            max-width: 350px;
            line-height: 1.6;
        }

        #tileTooltip div {
            margin: 2px 0;
        }

        #versionFooter {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(13, 17, 23, 0.95);
            border-top: 1px solid #30363d;
            padding: 8px 12px;
            font-size: 0.75rem;
            color: #8b949e;
            z-index: 150;
            backdrop-filter: blur(5px);
        }

        #versionFooter .main-version {
            font-weight: bold;
            color: #58a6ff;
        }

        #versionFooter .modules {
            font-size: 0.7rem;
            color: #6e7681;
            margin-top: 2px;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- Toggle Sidebar Button -->
        <button id="toggleSidebarBtn" class="btn btn-primary sidebar-visible">
            <i class="bi bi-list"></i>
        </button>

        <!-- Sidebar -->
        <div id="sidebar">
            <div class="card mb-3">
                <div class="card-header">
                    <i class="bi bi-map"></i> Pokemon Red Map Viewer
                </div>
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-center mb-2">
                        <span class="badge bg-success">Active Map</span>
                    </div>
                    <div class="npc-info-item">
                        <div><span class="npc-info-label">Map:</span> <span id="mapName" class="npc-info-value">Loading...</span></div>
                    </div>
                    <div class="npc-info-item">
                        <div><span class="npc-info-label">ID:</span> <span id="mapId" class="npc-info-value">-</span></div>
                    </div>
                    <div class="npc-info-item">
                        <div><span class="npc-info-label">Size:</span> <span id="mapSize" class="npc-info-value">-</span></div>
                    </div>
                    <div class="npc-info-item">
                        <div><span class="npc-info-label">Tileset:</span> <span id="tilesetName" class="npc-info-value">-</span></div>
                    </div>
                </div>
            </div>

            <div class="card mb-3">
                <div class="card-header">
                    <i class="bi bi-gear"></i> Controls
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label"><i class="bi bi-zoom-in"></i> Zoom Level: <span id="zoomLevel">1x</span></label>
                        <div class="btn-group w-100" role="group">
                            <button id="zoomOutBtn" class="btn btn-secondary btn-sm">
                                <i class="bi bi-dash-circle"></i> Out
                            </button>
                            <button id="resetZoomBtn" class="btn btn-secondary btn-sm">
                                <i class="bi bi-arrow-counterclockwise"></i> Reset & Center
                            </button>
                            <button id="zoomInBtn" class="btn btn-secondary btn-sm">
                                <i class="bi bi-plus-circle"></i> In
                            </button>
                        </div>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="showOverlaysCheckbox" checked>
                        <label class="form-check-label" for="showOverlaysCheckbox">
                            <i class="bi bi-eye"></i> Show Overlays (W/S/N)
                        </label>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="showGridCheckbox">
                        <label class="form-check-label" for="showGridCheckbox">
                            <i class="bi bi-grid-3x3"></i> Show Grid
                        </label>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="showCoordsCheckbox">
                        <label class="form-check-label" for="showCoordsCheckbox">
                            <i class="bi bi-cursor-text"></i> Show Coordinates
                        </label>
                    </div>

                    <div class="form-check form-switch mb-2">
                        <input class="form-check-input" type="checkbox" id="showTooltipCheckbox" checked>
                        <label class="form-check-label" for="showTooltipCheckbox">
                            <i class="bi bi-info-square"></i> Show Debug Tooltip
                        </label>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <i class="bi bi-list-ul"></i> Map List
                </div>
                <div class="card-body p-2">
                    <div id="mapList" class="map-list"></div>
                </div>
            </div>
        </div>

        <!-- Main Canvas Area -->
        <canvas id="mapCanvas"></canvas>
    </div>

    <!-- Loading Indicator -->
    <div id="loading" class="text-center" style="display: none;">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <p class="mt-3">Loading map data...</p>
    </div>

    <!-- Tile Tooltip -->
    <div id="tileTooltip"></div>

    <!-- Error Toast Container -->
    <div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 2000">
        <div id="errorToast" class="toast align-items-center text-bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="errorMessage">
                    <!-- Error message will be inserted here -->
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- NPC Info Modal -->
    <div class="modal fade" id="npcModal" tabindex="-1" aria-labelledby="npcModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="npcModalLabel">
                        <i class="bi bi-person-circle"></i> NPC Information
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="npcModalContent">
                        <!-- Content will be populated dynamically -->
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="bi bi-x-circle"></i> Close
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Version Footer -->
    <div id="versionFooter">
        <div class="main-version">Map Viewer v3.0.2 | Loading...</div>
        <div class="modules">Modules: Loading...</div>
    </div>

    <!-- Bootstrap 5.3 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Map Viewer - New Modular Architecture (ES6 Modules) -->
    <script type="module">
        // Cache buster for development - forces fresh module loads
        const CACHE_BUSTER = Date.now();
        
        // Store cache buster globally for module imports
        window.MODULE_CACHE_BUSTER = CACHE_BUSTER;
        
        console.log('🔄 Cache Buster:', CACHE_BUSTER);
        
        // Import main application with cache buster
        const { MapViewer } = await import(`./js/core/MapViewer.js?v=${CACHE_BUSTER}`);
        
        // Initialize when DOM ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initMapViewer);
        } else {
            // DOM already ready
            initMapViewer();
        }
        
        async function initMapViewer() {
            try {
                const viewer = new MapViewer('mapCanvas');
                await viewer.init();
                
                // Expose to window for debugging
                window.mapViewer = viewer;
                
                // Log module versions
                console.log('📦 Module Versions:', viewer.getModuleVersions());
                
                // Expose control functions to window for onclick handlers
                window.zoomIn = () => viewer.zoomIn();
                window.zoomOut = () => viewer.zoomOut();
                window.resetView = () => viewer.resetView();
                window.toggleOverlays = () => viewer.toggleOverlays();
                window.toggleCoordLabels = () => viewer.toggleCoordLabels();
                window.toggleSidebar = () => viewer.toggleSidebar();
                
                // Start memory and cache monitoring
                startMemoryMonitor();
                
            } catch (error) {
                console.error('❌ Fatal error initializing Map Viewer:', error);
                alert('Failed to initialize Map Viewer: ' + error.message);
            }
        }
        
        // Memory and cache monitoring
        function startMemoryMonitor() {
            function updateTitle() {
                let memoryInfo = '';
                let cacheInfo = '';
                
                // Get memory usage if available (Chrome/Edge)
                if (performance.memory) {
                    const usedMB = (performance.memory.usedJSHeapSize / 1024 / 1024).toFixed(1);
                    const totalMB = (performance.memory.jsHeapSizeLimit / 1024 / 1024).toFixed(1);
                    const usedPercent = ((performance.memory.usedJSHeapSize / performance.memory.jsHeapSizeLimit) * 100).toFixed(0);
                    memoryInfo = `Mem: ${usedMB}/${totalMB}MB (${usedPercent}%)`;
                }
                
                // Estimate cache usage from loaded resources
                if (window.mapViewer) {
                    const spriteCount = Object.keys(window.mapViewer.spriteManager?.spriteImages || {}).length;
                    const tilesetCount = Object.keys(window.mapViewer.tilesetManager?.tilesetImages || {}).length;
                    const blockDefCount = Object.keys(window.mapViewer.tilesetManager?.tilesetBlockDefinitions || {}).length;
                    const mapCount = window.mapViewer.mapData ? 1 : 0;
                    
                    // Calculate approximate cache size in MB
                    let cacheSizeBytes = 0;
                    
                    // Sprites: ~48x16 RGBA = ~3KB per sprite
                    cacheSizeBytes += spriteCount * 48 * 16 * 4;
                    
                    // Tilesets: ~128x128 RGBA = ~65KB per tileset
                    cacheSizeBytes += tilesetCount * 128 * 128 * 4;
                    
                    // Block definitions: estimate ~256 blocks * 16 bytes each = ~4KB per tileset
                    cacheSizeBytes += blockDefCount * 256 * 16;
                    
                    // Map data: estimate ~10KB per map
                    cacheSizeBytes += mapCount * 10 * 1024;
                    
                    const cacheSizeMB = (cacheSizeBytes / 1024 / 1024).toFixed(2);
                    cacheInfo = `Cache: ${cacheSizeMB}MB (${spriteCount}S | ${tilesetCount}T | ${blockDefCount}B | ${mapCount}M)`;
                }
                
                // Build title - cache first, then memory
                const parts = [];
                if (cacheInfo) parts.push(cacheInfo);
                if (memoryInfo) parts.push(memoryInfo);
                
                document.title = parts.length > 0 ? parts.join(' | ') : 'Map Viewer';
            }
            
            // Update immediately
            updateTitle();
            
            // Update every 2 seconds
            setInterval(updateTitle, 2000);
        }
    </script>
</body>
</html>
